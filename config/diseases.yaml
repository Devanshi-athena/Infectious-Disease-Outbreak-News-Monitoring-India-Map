# Diseases monitored: the list of the Integrated Disease Surveillance Programme (IDSP), as reported on the
# IHIP portal. Edit this file to add, remove or change diseases; no code changes needed. Stored articles are
# re-tagged automatically on the next run after a change.
#
# Source of the list: IHIP reporting forms S (syndromic), P (presumptive) and L (laboratory-confirmed), and
# the IDSP "P form / L form Case Definitions 2024" (NCDC; published by NHM Himachal Pradesh,
# https://nhm.hp.gov.in/idsp/reporting-format). Names follow the forms. Two entries are not on the forms:
# Food poisoning (the most frequent term in IDSP's own weekly outbreak reports) and COVID-19 (kept on
# purpose). Bird flu in humans is monitored; bird flu in animals is recognised but not monitored (animal
# health, not an IDSP condition).
#
#   name          IDSP condition name (shown on the dashboard).
#   code          Stable identifier. Names may be reworded; codes never change.
#   idsp          Where it is on the IDSP list: P / L form, S form item number, or another source.
#   category      Group for the "Disease group" filter on the dashboard.
#   keywords      Names, alternative names and spellings that mark an article as being about the condition.
#                 Matched as whole words, case-insensitive, in the headline and article text. Where two
#                 overlap, the longer wins ("Japanese encephalitis" is JE, not also AES).
#                 Outbreak words ("outbreak", "surge in cases", "deaths") are NOT keywords: they are relevance
#                 cues in config/relevance.yaml.
#   superseded_by A syndrome or unconfirmed form is dropped when one of these conditions is also named
#                 ("jaundice outbreak" + "hepatitis A" -> Hepatitis A only).
#   search_terms  Terms used to open each site's topic page (sources.yaml -> keyword_pages). Default: the first
#                 keyword; [] for none (rare conditions, to keep the number of requests reasonable).
#   native_keywords
#                 Names in the languages of the regional sources (regional_sources.yaml), per language code.
#                 Only names of this condition, not general words like "fever". Word endings are allowed
#                 ("डेंगू" also matches "डेंगूने"), except words of up to 3 letters and words ending in "=".
#   monitored     false: recognised but never tagged or shown (see the end of the list).
#
# screening_words (end of file): general words per language (fever, epidemic, jaundice) that make a regional
# article worth translating, without naming a disease. The native-language words should be reviewed by
# native speakers.

diseases:
  # ================================================================ Water- and food-borne
  - name: Acute Diarrhoeal Disease
    code: ADD
    idsp: P, L (S 2.8.2)
    category: Water- and food-borne
    # Includes acute gastroenteritis (P form). Dysentery (blood in stool) is its own condition.
    keywords: ["acute diarrhoeal disease", "acute diarrheal disease", "diarrhoea", "diarrhea", "gastroenteritis",
               "acute gastroenteritis", "loose motions", "loose motion"]
    search_terms: ["diarrhoea", "gastroenteritis"]
    superseded_by: ["Cholera", "Shigellosis"]
    native_keywords:
      hi: ["डायरिया", "उल्टी दस्त"]
      mr: ["अतिसार"]
      bn: ["ডায়রিয়া"]
      as: ["ডায়েৰিয়া"]
      te: ["డయేరియా", "అతిసార"]
      ta: ["வயிற்றுப்போக்கு"]

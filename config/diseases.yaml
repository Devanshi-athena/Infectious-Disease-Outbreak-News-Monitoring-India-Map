    # Unexplained illness or deaths, and conditions IDSP reports outside the list (e.g. Guillain-Barre syndrome,
    # hand, foot and mouth disease).
    keywords: ["mystery illness", "mysterious illness", "mystery disease", "mysterious disease", "unknown disease",
               "unidentified disease", "unexplained illness", "unexplained deaths", "mysterious deaths",
               "mystery deaths", "Guillain-Barre syndrome", "Guillain-Barré syndrome", "GBS cases",
               "hand, foot and mouth disease", "hand foot and mouth disease", "hand-foot-mouth disease"]
    search_terms: ["mysterious disease"]

  # ================================================================ Not monitored
  - name: Bird flu in animals (not monitored)
    code: NOT_MONITORED_BIRD_FLU
    idsp: not an IDSP condition (animal health)
    category: Not monitored
    monitored: false
    # Recognised so that "influenza" inside "avian influenza" is not counted as human influenza.
    keywords: ["bird flu", "avian influenza", "avian flu", "H5N1", "H5N8", "highly pathogenic avian influenza"]
    native_keywords:
      hi: ["बर्ड फ्लू"]
      mr: ["बर्ड फ्लू"]
      bn: ["বার্ড ফ্লু"]
      as: ["বাৰ্ড ফ্লু"]
      te: ["బర్డ్ ఫ్లూ"]
      ta: ["பறவைக் காய்ச்சல்", "பறவைக்காய்ச்சல்"]
      ur: ["برڈ فلو"]
      kn: ["ಹಕ್ಕಿ ಜ್ವರ"]
      or: ["ବାର୍ଡ ଫ୍ଲୁ"]
      ml: ["പക്ഷിപ്പനി"]

# General words that make a regional article worth translating: fever, epidemic, jaundice, loose motions.
# Per language; they apply only to sources in that language. They never tag a disease by themselves.
screening_words:
  hi: ["बुखार", "महामारी", "पीलिया"]
  mr: ["ताप", "तापा", "कावीळ", "साथीचे आजार", "जुलाब"]           # "तापा": तापाची, तापाने (not तापमान)
  gu: ["તાવ", "તાવના", "તાવથી", "તાવમાં", "રોગચાળો", "રોગચાળા", "કમળો", "કમળા", "ઝાડા"]
  bn: ["জ্বর", "জন্ডিস"]
  as: ["জ্বৰ", "জণ্ডিচ"]
  te: ["జ్వరం", "జ్వరాలు", "కామెర్లు"]
  ta: ["காய்ச்சல்", "மஞ்சள் காமாலை"]
  ur: ["بخار", "وبا", "یرقان"]
  kn: ["ಜ್ವರ", "ಕಾಮಾಲೆ"]
  or: ["ଜ୍ୱର", "ଜର", "ଜଣ୍ଡିସ"]
  ml: ["പനി", "പനിബാധ", "മഞ്ഞപ്പിത്തം"]
  pa: ["ਬੁਖਾਰ", "ਬੁਖ਼ਾਰ", "ਪੀਲੀਆ"]

settings:
  lookback_days: 45              # first run (backfill) collects this far back; older articles are ignored
  refresh_interval_minutes: 30   # scheduler interval for incremental runs
  backfill_max_pages: 10         # keyword-page pages read per search term during backfill
  country: India

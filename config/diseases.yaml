  # ---------------------------------------------------------------- Other epidemic-prone
  - name: Jaundice (cause not confirmed)
    category: Other epidemic-prone
    # Jaundice outbreaks where the cause isn't named. Outbreak phrasing only: plain "jaundice" also matches
    # liver disease and newborn care. Dropped when hepatitis A or E is named (the cause is then confirmed).
    keywords: ["jaundice outbreak", "outbreak of jaundice", "jaundice cases", "jaundice case", "cases of jaundice",
               "jaundice deaths", "jaundice death", "died of jaundice", "jaundice patients", "jaundice spread",
               "jaundice cluster"]
    search_terms: ["jaundice"]
    superseded_by: ["Hepatitis A / E"]

  - name: Unexplained fever / deaths / clusters
    category: Other epidemic-prone
    keywords: ["mystery fever", "mysterious fever", "unknown fever", "unidentified fever", "mystery illness",
               "mysterious illness", "mystery disease", "mysterious disease", "unknown disease",
               "unidentified disease", "unexplained illness", "unexplained deaths", "mysterious deaths",
               "mystery deaths", "fever outbreak", "viral fever outbreak", "fever cluster", "acute febrile illness"]
    search_terms: ["mystery fever", "mysterious disease"]

# General words that make a regional article worth translating: fever, epidemic, jaundice, loose motions.
# Per language; they apply only to sources in that language. They never tag a disease by themselves.
screening_words:
  hi: ["बुखार", "महामारी", "पीलिया"]
  mr: ["ताप", "तापा", "कावीळ", "साथीचे आजार", "जुलाब"]           # "तापा": तापाची, तापाने (not तापमान)
  gu: ["તાવ", "તાવના", "તાવથી", "તાવમાં", "રોગચાળો", "રોગચાળા", "કમળો", "કમળા", "ઝાડા"]
  bn: ["জ্বর", "জন্ডিস"]
  as: ["জ্বৰ", "জণ্ডিচ"]
  te: ["జ్వరం", "జ్వరాలు", "కామెర్లు"]
  ta: ["காய்ச்சல்", "மஞ்சள் காமாலை"]
  ur: ["بخار", "وبا", "یرقان"]
  kn: ["ಜ್ವರ", "ಕಾಮಾಲೆ"]
  or: ["ଜ୍ୱର", "ଜର", "ଜଣ୍ଡିସ"]
  ml: ["പനി", "പനിബാധ", "മഞ്ഞപ്പിത്തം"]
  pa: ["ਬੁਖਾਰ", "ਬੁਖ਼ਾਰ", "ਪੀਲੀਆ"]

settings:
  lookback_days: 45              # first run (backfill) collects this far back; older articles are ignored
  refresh_interval_minutes: 30   # scheduler interval for incremental runs
  backfill_max_pages: 10         # keyword-page pages read per search term during backfill
  country: India

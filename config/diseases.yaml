      mr: ["डेंग्यू"]
      gu: ["ડેન્ગ્યુ", "ડેન્ગ્યૂ"]
      bn: ["ডেঙ্গু", "ডেঙ্গি"]
      as: ["ডেংগু"]
      te: ["డెంగ్యూ", "డెంగీ"]
      ta: ["டெங்கு"]
      ur: ["ڈینگی", "ڈینگو"]
      kn: ["ಡೆಂಗ್ಯೂ", "ಡೆಂಗಿ"]
      or: ["ଡେଙ୍ଗୁ"]
      ml: ["ഡെങ്കി"]
      pa: ["ਡੇਂਗੂ"]


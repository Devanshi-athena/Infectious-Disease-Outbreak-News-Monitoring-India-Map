    keywords: ["first human case of bird flu", "first human case of H5N1", "first human case of avian influenza",
               "new human case of bird flu", "new human case of H5N1", "confirmed human case of bird flu",
               "confirmed human case of H5N1",
               "child|boy|girl|man|woman|toddler|patient|person dies|died of|from bird flu",
               "child|boy|girl|man|woman|toddler|patient|person dies|died of|from H5N1",
               "child|boy|girl|man|woman|toddler|patient|person dies|died of|from avian influenza",
               "child|boy|girl|man|woman|toddler|patient|person succumbs|succumbed to bird flu",
               "child|boy|girl|man|woman|toddler|patient|person succumbs|succumbed to H5N1",

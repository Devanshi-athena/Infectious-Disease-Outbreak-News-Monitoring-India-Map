# How disease names in the official IDSP weekly outbreak reports map to the monitored conditions
# (diseases.yaml, the IDSP list).
#
# The report's own wording is always stored as printed (disease_raw). A record is linked to a condition only
# when its term is listed here. Terms are compared in lower case, ignoring "Suspected" and anything in
# brackets ("Malaria (P. falciparum)" -> "malaria"). A combined entry such as "Scrub Typhus & Dengue" is
# split on "&", "and" and "," and each part is looked up.
#
# The same standard applies to news articles: the term must identify the condition. Jaundice without a named
# cause is the jaundice syndrome (S form), not hepatitis A or E; hepatitis without its type is acute viral
# hepatitis. Bird flu is mapped only when the report says it is in people; bird flu in animals is not an
# IDSP condition and is not mapped.

map:
  acute diarrhoeal disease: Acute Diarrhoeal Disease
  acute diarrheal disease: Acute Diarrhoeal Disease
  acute gastroenteritis: Acute Diarrhoeal Disease
  gastroenteritis: Acute Diarrhoeal Disease
  food poisoning: Food poisoning
  dysentery: Dysentery
  dysentry: Dysentery                            # spelling used in the reports
  cholera: Cholera
  shigellosis: Shigellosis
  non typhoidal salmonellosis: Non-typhoidal salmonellosis
  typhoid: Enteric fever (Typhoid)
  enteric fever: Enteric fever (Typhoid)

# Regional-language news sources (same format as sources.yaml, plus `language`). Articles are screened in
# their own language and only the relevant ones are translated to English (outbreak_monitor/translate.py).
# ETV Bharat sources also have per-state archive sitemaps (one file per day), read during backfill.
# Ordered within each language by reach. Only links on each source's own domain are collected;
# robots.txt is checked before every request.

sources:
  # ---------------------------------------------------------------- Hindi (15)
  - name: Dainik Bhaskar
    language: hi
    domain: www.bhaskar.com
    sitemaps:   # index of ~26 parts (700 articles each, last 48 h), including all local district editions
      - https://www.bhaskar.com/sitemaps-v1--sitemap-google-news-index.xml

  - name: Dainik Jagran
    language: hi
    domain: www.jagran.com
    sitemaps:
      - https://www.jagran.com/all-news-sitemap.xml

  - name: Amar Ujala
    language: hi
    domain: www.amarujala.com
    sitemaps:
      - https://www.amarujala.com/sitemap-news-v1.xml

  - name: Live Hindustan
    language: hi
    domain: www.livehindustan.com
    sitemaps:
      - https://www.livehindustan.com/news-sitemap.xml
    archive_sitemaps:   # monthly parts, e.g. lhfeed/sitemap/2026/nov-6.xml (URLs only)
      - https://www.livehindustan.com/sitemap-index.xml
    archive_child_pattern: '/lhfeed/sitemap/\d{4}/[a-z]{3}-\d+\.xml$'

  - name: Patrika
    language: hi
    domain: www.patrika.com
    sitemaps:
      - https://www.patrika.com/google-news-sitemap-v1.xml
    archive_sitemaps:   # one sitemap per day (URLs only)
      - https://www.patrika.com/newurlsitemapindex.xml
    archive_child_pattern: '/date/google-sitemap-\d{4}-\d{2}-\d{2}\.xml$'

  - name: Navbharat Times
    language: hi
    domain: navbharattimes.indiatimes.com
    rss:
      - https://navbharattimes.indiatimes.com/langapi/sitemap/gstandrssfeed.xml
    sitemaps:
      - https://navbharattimes.indiatimes.com/staticsitemap/nbt/news/sitemap-48hours.xml
    archive_sitemaps:   # monthly parts, e.g. 2026-November-1.xml (URLs only)
      - https://navbharattimes.indiatimes.com/staticsitemap/nbt/news/sitemap-index.xml
    archive_child_pattern: '/news/\d{4}-[A-Za-z]+-\d+\.xml$'


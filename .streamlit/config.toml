# Dashboard server settings. Only this computer can open the dashboard (it can save review
# decisions and start collection runs). Change address to "0.0.0.0" only behind proper access control.
[server]
address = "localhost"
port = 8501
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"   # no "Deploy" button

# Public-health portal look: cool grey page, white cards, navy and blue accents, Inter type.
[theme]
base = "light"
primaryColor = "#1554A6"
backgroundColor = "#F4F6FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
linkColor = "#1554A6"
borderColor = "#E2E8F0"
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F1F4F9"
headingFont = "Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
font = "Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
baseRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6FA"
